<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cápsula Voadora VTOL - Projeto 3D</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        #interface-hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #45f3ff;
            background: rgba(10, 15, 28, 0.85);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid rgba(69, 243, 255, 0.3);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.15);
            pointer-events: none;
            z-index: 10;
            backdrop-filter: blur(5px);
            max-width: 300px;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 16px;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 5px;
        }
        .hud-line {
            display: flex;
            justify-content: space-between;
            margin: 6px 0;
            font-size: 12px;
            font-family: monospace;
        }
        .hud-value {
            color: #fff;
            font-weight: bold;
        }
        .instruction {
            margin-top: 15px;
            font-size: 11px;
            color: #8a9ba8;
            line-height: 1.4;
        }
    </style>
    <!-- Bibliotecas estáveis via CDN do CDNJS -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <!-- Interface HUD Estilo Vidro de Caça -->
    <div id="interface-hud">
        <h1>SISTEMA VTOL ATIVO</h1>
        <div class="hud-line"><span>ALTITUDE:</span><span class="hud-value" id="hud-alt">1.50m</span></div>
        <div class="hud-line"><span>BATERIA:</span><span class="hud-value" style="color: #00ff88;">98.4%</span></div>
        <div class="hud-line"><span>ÂNGULO GARRAS:</span><span class="hud-value">90.0° (LIFT)</span></div>
        <div class="hud-line"><span>PRESSÃO ATM:</span><span class="hud-value">1013 hPa</span></div>
        <div class="hud-line"><span>RADAR GPS:</span><span class="hud-value" style="color: #ff5500;">CONECTADO</span></div>
        
        <div class="instruction">
             Arraste com o <b>botão esquerdo</b> para girar a nave.<br>
             Use a <b>roda do mouse</b> para dar zoom.<br>
             Arraste com o <b>botão direito</b> para mover a câmera.
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- CONFIGURAÇÃO DA CENA E AMBIENTE ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050508, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1.5, 4.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1; 
        controls.minDistance = 2;
        controls.maxDistance = 10;

        // --- ILUMINAÇÃO ---
        const ambientLight = new THREE.AmbientLight(0x0a1128, 1.5);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
        sunLight.position.set(10, 20, 10);
        scene.add(sunLight);

        const ledJetLight = new THREE.PointLight(0x00ffff, 3, 8);
        ledJetLight.position.set(0, -1, 0);
        scene.add(ledJetLight);

        // --- ELEMENTOS DO CENÁRIO ---
        const gridHelper = new THREE.GridHelper(60, 60, 0x45f3ff, 0x1f2833);
        gridHelper.position.y = -1.2;
        gridHelper.material.opacity = 0.2;
        gridHelper.material.transparent = true;
        scene.add(gridHelper);

        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 1000;
        const starPositions = new Float32Array(starsCount * 3);
        for(let i=0; i<starsCount*3; i++) {
            starPositions[i] = (Math.random() - 0.5) * 100;
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({color: 0x8a9ba8, size: 0.1});
        const starField = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starField);

        // --- MATERIAIS DA AERONAVE ---
        const matCarcaça = new THREE.MeshStandardMaterial({ 
            color: 0x1a233a, roughness: 0.25, metalness: 0.95 
        });
        const matVidro = new THREE.MeshStandardMaterial({ 
            color: 0xff4500, transparent: true, opacity: 0.35, roughness: 0.05, metalness: 0.1
        });
        const matMetalEscovado = new THREE.MeshStandardMaterial({ 
            color: 0xcccccc, roughness: 0.4, metalness: 0.9 
        });
        const matDutos = new THREE.MeshStandardMaterial({ 
            color: 0x0f1424, roughness: 0.5, metalness: 0.8 
        });
        const matLED = new THREE.MeshBasicMaterial({ 
            color: 0x00ffff 
        });

        const capsulaNave = new THREE.Group();

        // 1. Corpo Redondo Principal (Cockpit)
        const geoCorpo = new THREE.SphereGeometry(1.0, 32, 32);
        const corpo = new THREE.Mesh(geoCorpo, matCarcaça);
        corpo.scale.set(1, 0.9, 1.1); 
        capsulaNave.add(corpo);

        // 2. Vidro Frontal Alaranjado
        const geoVidro = new THREE.SphereGeometry(0.99, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2.2);
        const vidro = new THREE.Mesh(geoVidro, matVidro);
        vidro.rotation.x = Math.PI / 3.2;
        vidro.position.set(0, 0.15, 0.15);
        capsulaNave.add(vidro);

        // 3. Turbina Turbojato Traseira Oculta
        const geoTurbina = new THREE.CylinderGeometry(0.35, 0.28, 0.8, 32);
        const turbina = new THREE.Mesh(geoTurbina, matMetalEscovado);
        turbina.rotation.x = Math.PI / 2;
        turbina.position.set(0, 0, -0.9);
        capsulaNave.add(turbina);

        // 4. Dutos Laterais de Vento Dividido
        const criarDutoLateral = (lado) => {
            const dutoGeom = new THREE.CylinderGeometry(0.12, 0.15, 1.2, 16);
            const duto = new THREE.Mesh(dutoGeom, matDutos);
            duto.position.set(0.85 * lado, -0.3, -0.1);
            duto.rotation.z = (-15 * lado) * (Math.PI / 180);
            duto.rotation.x = (20) * (Math.PI / 180);
            return duto;
        };
        capsulaNave.add(criarDutoLateral(1));  
        capsulaNave.add(criarDutoLateral(-1)); 

        // 5. Garras Estabilizadoras Curvas Superiores
        const criarGarraEstabilizadora = (lado) => {
            const pontosCurva = [
                new THREE.Vector3(0.9 * lado, 0.2, -0.2),
                new THREE.Vector3(1.3 * lado, 0.8, -0.4),
                new THREE.Vector3(0.8 * lado, 1.4, -0.6)
            ];
            const caminhoCurva = new THREE.CatmullRomCurve3(pontosCurva);
            const geoGarra = new THREE.TubeGeometry(caminhoCurva, 30, 0.09, 16, false);
            return new THREE.Mesh(geoGarra, matCarcaça);
        };
        capsulaNave.add(criarGarraEstabilizadora(1));  
        capsulaNave.add(criarGarraEstabilizadora(-1)); 

        // 6. Anel de Levitação de LED Azul na Base
        const geoAnelLED = new THREE.TorusGeometry(0.65, 0.05, 16, 100);
        const anelLED = new THREE.Mesh(geoAnelLED, matLED);
        anelLED.rotation.x = Math.PI / 2;
        anelLED.position.set(0, -0.85, 0);
        capsulaNave.add(anelLED);

        // 7. Trem de Pouso Triciclo Retrátil (Metal Escovado Aeronáutico)
        const criarPernaPouso = (x, z, rotZ) => {
            const pernaGrupo = new THREE.Group();
            const geoHaste = new THREE.CylinderGeometry(0.04, 0.04, 0.5, 16);
            const haste = new THREE.Mesh(geoHaste, matMetalEscovado);
            haste.position.y = -0.25;
            pernaGrupo.add(haste);
            
            const geoSapata = new THREE.CylinderGeometry(0.12, 0.12, 0.03, 16);
            const sapata = new THREE.Mesh(geoSapata, matMetalEscovado);
            sapata.position.y = -0.5;
            pernaGrupo.add(sapata);

            pernaGrupo.position.set(x, -0.7, z);
            pernaGrupo.rotation.z = rotZ * (Math.PI / 180);
            return pernaGrupo;
        };
        capsulaNave.add(criarPernaPouso(0, 0.5, 0));      
        capsulaNave.add(criarPernaPouso(0.5, -0.4, -15));  
        capsulaNave.add(criarPernaPouso(-0.5, -0.4, 15)); 

        scene.add(capsulaNave);

        // --- RESPONSIVIDADE ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- LOOP DE ANIMAÇÃO ---
        const clock = new THREE.Clock();
        const altHudElement = document.getElementById('hud-alt');
